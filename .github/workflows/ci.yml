name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild + scan picks up new base-image patches

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest ruff pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import whitelister; print(whitelister.__version__)')"
          test "$tag" = "$code" || { echo "tag v$tag but whitelister.__version__ is $code"; exit 1; }
      - name: Test
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit --require-hashes -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: bunkerweb-whitelister:ci
      - name: Smoke test
        run: |
          docker run -d --name wl --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp -e WHITELISTER_PASSWORD=ci-password-123456 -e COOKIE_SECURE=no -e TRUSTED_PROXIES=none \
            -p 8080:8080 bunkerweb-whitelister:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok"'
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/ | grep -q 303
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ips.txt)" = 200
          docker exec wl sh -c 'id -u' | grep -q '^10001$'
          docker logs wl
          docker rm -f wl
      # Full report for the Security tab (every severity, never fails the build) ...
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bunkerweb-whitelister:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"
      # ... and the gate: any fixable HIGH/CRITICAL vulnerability or secret fails the build.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bunkerweb-whitelister:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy.sarif

  # Publishing is its own job: only this one holds a token that may write packages, and it only
  # exists on main and on version tags, after tests, build, smoke test and scan have passed.
  publish:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
