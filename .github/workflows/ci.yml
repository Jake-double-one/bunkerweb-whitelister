name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild + scan picks up new base-image patches

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest ruff pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit --require-hashes -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bunkerweb-whitelister:ci
      - name: Smoke test
        run: |
          docker run -d --name wl --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp -e WHITELISTER_PASSWORD=ci-password-123456 -e COOKIE_SECURE=no -e TRUSTED_PROXIES=none \
            -p 8080:8080 bunkerweb-whitelister:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok"'
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/ | grep -q 303
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ips.txt)" = 200
          docker exec wl sh -c 'id -u' | grep -q '^10001$'
          docker logs wl
          docker rm -f wl
      # Full report for the Security tab (every severity, never fails the build) ...
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bunkerweb-whitelister:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"
      # ... and the gate: any fixable HIGH/CRITICAL vulnerability or secret fails the build.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bunkerweb-whitelister:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
