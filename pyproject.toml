[project]
name = "bunkerweb-whitelister"
version = "0.1.0"
description = "Password-protected front end for BunkerWeb's global IP whitelist, with expiring entries."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "httpx",
  "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pip-tools"]

[tool.ruff]
line-length = 140
exclude = ["docs"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:whitelister"]
